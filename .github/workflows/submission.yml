name: submission-format
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      final_submission:
        description: Require both actual DEV (65) and PROD (10) artifacts
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  validate-submissions:
    runs-on: ubuntu-latest
    env:
      FINAL_SUBMISSION: ${{ github.event_name == 'workflow_dispatch' && inputs.final_submission && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent validator regressions (synthetic data only in temporary directories)
        run: python -m unittest discover -s scripts/tests -p 'test_submission*.py' -v
      - name: Compile standalone release tools
        run: python -m py_compile scripts/validate_submission.py scripts/check_submission_delivery.py scripts/drill_submission_delivery.py scripts/generate_submission_reference.py
      - name: Validate existing real artifacts or require both at final delivery
        shell: bash
        run: |
          set -euo pipefail
          # The committed dev reference carries conversation IDs only (already
          # public in results/dev/results.json), so CI verifies source identity
          # without transcripts. Evidence bounds stay verified locally through
          # verify_submission_db.py and the pre-push final gate with the
          # transcript-bearing reference in gitignored data/.
          if [[ "$FINAL_SUBMISSION" == "1" ]]; then
            python scripts/check_submission_delivery.py --final \
              --dev-source scripts/submission_reference_dev.json
          else
            python scripts/check_submission_delivery.py \
              --dev-source scripts/submission_reference_dev.json
          fi
