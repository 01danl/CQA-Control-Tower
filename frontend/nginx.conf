server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hash navigation requires no SPA rewrite or server-side routes.
    location / {
        try_files $uri $uri/ =404;
    }
}
