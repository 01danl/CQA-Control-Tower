<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CQA Multi-Model Benchmark Lab — local</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>CQA Multi-Model Benchmark Lab</h1>
  <div class="controls">
    <select id="experiment"></select>
    <span id="meta" class="meta"></span>
  </div>
</header>
<nav class="tabs">
  <button data-tab="summary" class="active">Summary</button>
  <button data-tab="cases">Per conversation</button>
  <button data-tab="sidebyside">C01–C08 side-by-side</button>
</nav>
<main>
  <section id="summary" class="tab active">
    <div id="cards" class="cards"></div>
    <div class="filters">
      <select id="f-model"><option value="">model: all</option></select>
      <select id="f-lang"><option value="">language: all</option></select>
      <select id="f-channel"><option value="">channel: all</option></select>
      <select id="f-status">
        <option value="">status: all</option>
        <option>completed</option>
        <option>failed</option>
        <option>not_run</option>
      </select>
    </div>
    <table id="latency" class="grid"></table>
    <p class="note">All numbers come from recorded experiment runs and provenance-verified
    official baseline rows; nothing is fabricated. Cost is provider-reported.</p>
  </section>
  <section id="cases" class="tab">
    <table id="case-table" class="grid"></table>
  </section>
  <section id="sidebyside" class="tab">
    <div class="filters">
      <select id="sb-conversation"></select>
    </div>
    <div id="sb-header" class="sb-header"></div>
    <div id="sb-grid"></div>
  </section>
</main>
<dialog id="detail">
  <div class="dialog-head">
    <h2 id="d-title"></h2>
    <button onclick="document.getElementById('detail').close()">Close</button>
  </div>
  <div id="d-summary" class="d-summary"></div>
  <div class="dialog-body">
    <div id="d-results" class="d-results"></div>
    <div id="d-transcript" class="d-transcript"></div>
  </div>
</dialog>
<footer>
  <button id="export-json">Export JSON</button>
  <button id="export-csv">Export CSV</button>
  <span class="meta">Local-only viewer · no credentials · transcripts stay on this machine</span>
</footer>
<script src="app.js"></script>
</body>
</html>
